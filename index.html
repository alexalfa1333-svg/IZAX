<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZAX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, Arial, sans-serif; }
    body.lock { overflow: hidden; }

    /* ===== INTRO: rotating globe ===== */
    #intro {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #intro.hide { opacity: 0; visibility: hidden; }

    #globe {
      width: min(88vw, 480px);
      aspect-ratio: 1;
      filter: drop-shadow(0 0 14px rgba(255,255,255,.28));
      opacity: 0;
      transform: scale(.7);
      animation: appear 1.2s cubic-bezier(.2,.8,.2,1) .1s forwards;
    }
    @keyframes appear { to { opacity: 1; transform: scale(1); } }

    .skip {
      position: absolute; bottom: 6vh;
      font-size: 13px; letter-spacing: .06em;
      color: rgba(255,255,255,.45);
    }

    /* ===== HOME PAGE ===== */
    #site { opacity: 0; transition: opacity 1s ease .4s; padding: 60px 20px; text-align: center; }
    #site.show { opacity: 1; }
  </style>
</head>
<body class="lock">

  <!-- Globe intro -->
  <div id="intro">
    <canvas id="globe"></canvas>
    <div class="skip">Tap to enter</div>
  </div>

  <!-- Unga home page content inga podunga -->
  <main id="site">
    <h1>Welcome to IZAX</h1>
    <p style="margin-top:12px;color:#aaa">Your home page content goes here.</p>
  </main>

  <script>
    /* ---------- SETTINGS (inga maathikalam) ---------- */
    const INTRO_TIME = 6000;   // milliseconds. Intro evlo neram irukkanum
    const SPEED      = 0.6;    // globe sutthura vegam (radians per second)
    const LINE_COLOR = "255,255,255"; // white (RGB)

    /* ---------- SETUP ---------- */
    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");
    let W, R, cx, cy;
    const TILT = 18 * Math.PI / 180;
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

    function resize() {
      const size = canvas.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = size; cx = W / 2; cy = W / 2; R = W * 0.34;
    }
    window.addEventListener("resize", resize);
    resize();

    /* 3D point -> screen point (with tilt) */
    function project(x, y, z) {
      const y2 = y * cosT - z * sinT;
      const z2 = y * sinT + z * cosT;
      return { x: cx + x * R, y: cy - y2 * R, z: z2 };
    }

    /* Draw a line made of many points; front = bright, back = faint */
    function strokeLine(points, lw) {
      const front = new Path2D(), back = new Path2D();
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const p = (a.z + b.z) / 2 > 0 ? front : back;
        p.moveTo(a.x, a.y);
        p.lineTo(b.x, b.y);
      }
      ctx.lineCap = "round";
      ctx.lineWidth = lw;
      ctx.strokeStyle = `rgba(${LINE_COLOR},0.16)`;
      ctx.stroke(back);
      ctx.strokeStyle = `rgba(${LINE_COLOR},1)`;
      ctx.stroke(front);
    }

    /* ---------- GLOBE ---------- */
    function drawGlobe(rot) {
      const lw = Math.max(2, R * 0.024);
      const N = 90;

      // outer circle
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.lineWidth = lw * 1.2;
      ctx.strokeStyle = `rgba(${LINE_COLOR},1)`;
      ctx.stroke();

      // meridians (long lines - these rotate)
      for (let k = 0; k < 6; k++) {
        const L = rot + k * Math.PI / 6;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const t = (i / N) * Math.PI * 2;
          pts.push(project(Math.sin(L) * Math.cos(t), Math.sin(t), Math.cos(L) * Math.cos(t)));
        }
        strokeLine(pts, lw);
      }

      // parallels (cross lines)
      [-60, -30, 0, 30, 60].forEach(deg => {
        const phi = deg * Math.PI / 180;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const a = (i / N) * Math.PI * 2;
          pts.push(project(Math.cos(phi) * Math.sin(a), Math.sin(phi), Math.cos(phi) * Math.cos(a)));
        }
        strokeLine(pts, lw);
      });
    }

    /* ---------- ORBIT ARROWS (globe-a sutthi varra arrows) ---------- */
    const ORBIT_R = 1.3;
    const ORBIT_Z = -38 * Math.PI / 180;   // orbit saaivu

    function orbitPoint(t) {
      const x = Math.cos(t) * ORBIT_R, z = Math.sin(t) * ORBIT_R;
      const xr = x * Math.cos(ORBIT_Z), yr = x * Math.sin(ORBIT_Z);
      return project(xr, yr, z);
    }

    function drawArrow(phase) {
      const span = 1.7, steps = 46;
      let prev = null;
      for (let i = 0; i <= steps; i++) {
        const t = phase - span + (i / steps) * span;
        const p = orbitPoint(t);
        if (prev) {
          const alpha = p.z > 0 ? 1 : 0.18;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(p.x, p.y);
          ctx.lineCap = "round";
          ctx.lineWidth = 1 + (i / steps) * R * 0.055;   // thin -> thick
          ctx.strokeStyle = `rgba(${LINE_COLOR},${alpha})`;
          ctx.stroke();
        }
        prev = p;
      }
      // arrow head
      const tip = orbitPoint(phase + 0.22);
      const dx = tip.x - prev.x, dy = tip.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const w = R * 0.11;
      const alpha = prev.z > 0 ? 1 : 0.18;
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(prev.x - uy * w, prev.y + ux * w);
      ctx.lineTo(prev.x + uy * w, prev.y - ux * w);
      ctx.closePath();
      ctx.fillStyle = `rgba(${LINE_COLOR},${alpha})`;
      ctx.fill();
    }

    /* ---------- IZAX TEXT (box illa - sinnadhula irundhu perusaga varum) ---------- */
    const TEXT_DELAY = 0.5;   // seconds - globe vandhu apram text start aagum
    const TEXT_GROW  = 2.4;   // seconds - text perusaga aaga edukkum neram

    function easeOutBack(x) {
      const c1 = 1.5, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function drawText(elapsed) {
      const p = Math.min(Math.max((elapsed - TEXT_DELAY) / TEXT_GROW, 0), 1);
      if (p <= 0) return;
      const scale = 0.06 + 0.94 * easeOutBack(p);   // chinna -> periya
      const size = R * 0.52 * scale;

      ctx.save();
      ctx.globalAlpha = Math.min(p * 3, 1);          // lesa fade-in
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.font = `900 ${size}px "Arial Black", Arial, Helvetica, sans-serif`;

      // black outline - box illama text clear-a theriya
      ctx.lineWidth = size * 0.3;
      ctx.strokeStyle = "#000";
      ctx.strokeText("IZAX", cx, cy + size * 0.04);

      ctx.fillStyle = "#fff";
      ctx.fillText("IZAX", cx, cy + size * 0.04);
      ctx.restore();
    }

    /* ---------- ANIMATION LOOP ---------- */
    const startTime = performance.now();
    let last = startTime, rot = 0, orbit = 0;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reduce) { rot += dt * SPEED; orbit += dt * SPEED * 1.5; }

      ctx.clearRect(0, 0, W, W);
      drawArrow(orbit);              // arrow 1
      drawArrow(orbit + Math.PI);    // arrow 2 (ethir pakkam)
      drawGlobe(rot);
      drawText((now - startTime) / 1000);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---------- INTRO -> HOME PAGE ---------- */
    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    let done = false;

    function enterSite() {
      if (done) return;
      done = true;
      intro.classList.add("hide");
      site.classList.add("show");
      document.body.classList.remove("lock");
    }
    intro.addEventListener("click", enterSite);        // tap pannina skip aagum
    setTimeout(enterSite, INTRO_TIME);                 // illa na auto-va povum
  </script>
</body>
</html>
