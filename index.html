<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IZAX</title>

  <!-- ===== APP MODE (PWA) meta - makes the site open like an app on phone, laptop and iPad ===== -->
  <meta name="application-name" content="IZAX">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IZAX">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <!-- manifest and icons are created automatically by the script below -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, Arial, sans-serif; }
    body.lock { overflow: hidden; }
    body {
      overscroll-behavior: none;                 /* no bounce / pull-to-refresh, like a native app */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== INTRO: rotating globe ===== */
    #intro {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      --w: min(88vw, 480px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #intro.hide { opacity: 0; visibility: hidden; }

    #globe {
      width: var(--w);
      aspect-ratio: 1;
      filter: drop-shadow(0 0 14px rgba(255,255,255,.28));
      opacity: 0;
      transform: scale(.7);
      animation: appear 1.2s cubic-bezier(.2,.8,.2,1) .1s forwards;
    }
    @keyframes appear { to { opacity: 1; transform: scale(1); } }

    /* IZAX text - sits below the globe, letters animate in one by one */
    .brand {
      margin-top: calc(var(--w) * -0.1);
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: calc(var(--w) * 0.17);
      letter-spacing: .1em;
      padding-left: .1em;              /* keeps the text centered despite letter-spacing */
      color: #fff;
      text-shadow: 0 0 14px rgba(255,255,255,.28);
      line-height: 1;
      white-space: nowrap;
    }
    .brand span {
      display: inline-block;
      opacity: 0;
      animation: letterIn 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .brand span:nth-child(1) { animation-delay: .9s; }
    .brand span:nth-child(2) { animation-delay: 1.1s; }
    .brand span:nth-child(3) { animation-delay: 1.3s; }
    .brand span:nth-child(4) { animation-delay: 1.5s; }
    @keyframes letterIn {
      0%   { opacity: 0; transform: translateY(40%) scale(.3); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1);    filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand span { animation: none; opacity: 1; }
    }

    .skip {
      position: absolute; bottom: calc(6vh + env(safe-area-inset-bottom, 0px));
      font-size: 13px; letter-spacing: .06em;
      color: rgba(255,255,255,.45);
    }

    /* ===== HOME PAGE ===== */
    #site { opacity: 0; transition: opacity 1s ease .4s; text-align: center;
      padding: calc(60px + env(safe-area-inset-top, 0px)) 20px calc(100px + env(safe-area-inset-bottom, 0px)); }
    #site.show { opacity: 1; }

    /* ===== INSTALL APP button + iPhone guide ===== */
    #installBtn {
      position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      padding: 14px 26px; border-radius: 999px;
      background: #fff; color: #000; border: 0;
      font: 700 15px/1 system-ui, Arial, sans-serif; letter-spacing: .02em;
      box-shadow: 0 0 24px rgba(255,255,255,.25);
      cursor: pointer;
    }
    #installBtn[hidden], #iosTip[hidden] { display: none; }

    #iosTip {
      position: fixed; z-index: 60; inset: 0;
      background: rgba(0,0,0,.7);
      display: flex; align-items: flex-end; justify-content: center;
    }
    #iosTip .sheet {
      width: min(100%, 460px);
      background: #111; border: 1px solid #333; border-radius: 22px 22px 0 0;
      padding: 24px 22px calc(24px + env(safe-area-inset-bottom, 0px));
      text-align: left;
    }
    #iosTip h3 { font-size: 18px; margin-bottom: 14px; }
    #iosTip ol { padding-left: 20px; line-height: 1.9; color: #ddd; font-size: 15px; }
    #iosTip button {
      margin-top: 18px; width: 100%; padding: 13px; border-radius: 12px;
      border: 0; background: #fff; color: #000; font: 700 15px system-ui, Arial, sans-serif;
    }
  </style>
</head>
<body class="lock">

  <!-- Globe intro -->
  <div id="intro">
    <canvas id="globe"></canvas>
    <h1 class="brand" aria-label="IZAX"><span>I</span><span>Z</span><span>A</span><span>X</span></h1>
    <div class="skip">Tap to enter</div>
  </div>

  <!-- Put your home page content here -->
  <main id="site">
    <h1>Welcome to IZAX</h1>
    <p style="margin-top:12px;color:#aaa">Your home page content goes here.</p>
  </main>

  <!-- Install button (shown only when the app can be installed) -->
  <button id="installBtn" hidden>Install IZAX App</button>

  <!-- iPhone / iPad guide -->
  <div id="iosTip" hidden>
    <div class="sheet">
      <h3>Install the IZAX app</h3>
      <ol>
        <li>Tap the <b>Share</b> button (&#11014;&#65039;) in Safari</li>
        <li>Scroll down and tap <b>Add to Home Screen</b></li>
        <li>Tap <b>Add</b>. The IZAX app will appear on your home screen</li>
      </ol>
      <button id="iosClose">Got it</button>
    </div>
  </div>

  <script>
    /* ===================================================================
       APP MODE (PWA) - icon, manifest, service worker, install button
       =================================================================== */

    /* 1) App icon - created in code, no image file needed */
    function makeIcon(size) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      g.fillStyle = "#000";
      g.fillRect(0, 0, size, size);

      const x = size / 2, y = size * 0.44, r = size * 0.26;
      g.strokeStyle = "#fff";
      g.lineWidth = size * 0.02;
      g.lineCap = "round";

      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();                 // globe outline
      [0.4, 0.72].forEach(k => {                                                  // meridians
        g.beginPath(); g.ellipse(x, y, r * k, r, 0, 0, Math.PI * 2); g.stroke();
      });
      g.beginPath(); g.moveTo(x, y - r); g.lineTo(x, y + r); g.stroke();
      [-0.5, 0, 0.5].forEach(k => {                                               // parallels
        const hw = r * Math.sqrt(1 - k * k);
        g.beginPath(); g.ellipse(x, y + r * k, hw, hw * 0.2, 0, 0, Math.PI); g.stroke();
      });

      g.fillStyle = "#fff";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.font = `900 ${size * 0.13}px "Arial Black", Arial, sans-serif`;
      g.fillText("IZAX", x, size * 0.82);
      return c.toDataURL("image/png");
    }

    /* 2) iPhone / iPad home screen icon */
    const touchIcon = document.createElement("link");
    touchIcon.rel = "apple-touch-icon";
    touchIcon.href = makeIcon(180);
    document.head.appendChild(touchIcon);

    const favicon = document.createElement("link");
    favicon.rel = "icon";
    favicon.href = makeIcon(64);
    document.head.appendChild(favicon);

    /* 3) Web App Manifest (Android / Windows / Mac / iPad Chrome, Edge) */
    (function () {
      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      const manifest = {
        id: base,
        name: "IZAX",
        short_name: "IZAX",
        start_url: base,
        scope: base,
        display: "standalone",
        background_color: "#000000",
        theme_color: "#000000",
        icons: [
          { src: makeIcon(192), sizes: "192x192", type: "image/png", purpose: "any" },
          { src: makeIcon(512), sizes: "512x512", type: "image/png", purpose: "any" },
          { src: makeIcon(512), sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
      document.head.appendChild(link);
    })();

    /* 4) Service worker (sw.js must be in the same folder) - enables offline use */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    /* 5) Install button */
    const installBtn = document.getElementById("installBtn");
    const iosTip = document.getElementById("iosTip");
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {   // Android, Windows, Mac (Chrome/Edge)
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) installBtn.hidden = false;
    });
    window.addEventListener("appinstalled", () => { installBtn.hidden = true; deferredPrompt = null; });

    if (isIOS && !isStandalone) installBtn.hidden = false;    // iPhone / iPad - show the install guide

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      } else if (isIOS) {
        iosTip.hidden = false;
      }
    });
    document.getElementById("iosClose").addEventListener("click", () => { iosTip.hidden = true; });
    iosTip.addEventListener("click", (e) => { if (e.target === iosTip) iosTip.hidden = true; });

    /* ===================================================================
       INTRO ANIMATION
       =================================================================== */

    /* ---------- SETTINGS (you can change these) ---------- */
    const INTRO_TIME = 6000;   // milliseconds - how long the intro stays
    const SPEED      = 0.6;    // globe rotation speed (radians per second)
    const LINE_COLOR = "255,255,255"; // white (RGB)

    /* ---------- SETUP ---------- */
    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");
    let W, R, cx, cy;
    const TILT = 18 * Math.PI / 180;
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

    function resize() {
      const size = canvas.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = size; cx = W / 2; cy = W / 2; R = W * 0.34;
    }
    window.addEventListener("resize", resize);
    resize();

    /* 3D point -> screen point (with tilt) */
    function project(x, y, z) {
      const y2 = y * cosT - z * sinT;
      const z2 = y * sinT + z * cosT;
      return { x: cx + x * R, y: cy - y2 * R, z: z2 };
    }

    /* Draw a line made of many points; front = bright, back = faint */
    function strokeLine(points, lw) {
      const front = new Path2D(), back = new Path2D();
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const p = (a.z + b.z) / 2 > 0 ? front : back;
        p.moveTo(a.x, a.y);
        p.lineTo(b.x, b.y);
      }
      ctx.lineCap = "round";
      ctx.lineWidth = lw;
      ctx.strokeStyle = `rgba(${LINE_COLOR},0.16)`;
      ctx.stroke(back);
      ctx.strokeStyle = `rgba(${LINE_COLOR},1)`;
      ctx.stroke(front);
    }

    /* ---------- GLOBE ---------- */
    function drawGlobe(rot) {
      const lw = Math.max(2, R * 0.024);
      const N = 90;

      // outer circle
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.lineWidth = lw * 1.2;
      ctx.strokeStyle = `rgba(${LINE_COLOR},1)`;
      ctx.stroke();

      // meridians (long lines - these rotate)
      for (let k = 0; k < 6; k++) {
        const L = rot + k * Math.PI / 6;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const t = (i / N) * Math.PI * 2;
          pts.push(project(Math.sin(L) * Math.cos(t), Math.sin(t), Math.cos(L) * Math.cos(t)));
        }
        strokeLine(pts, lw);
      }

      // parallels (cross lines)
      [-60, -30, 0, 30, 60].forEach(deg => {
        const phi = deg * Math.PI / 180;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const a = (i / N) * Math.PI * 2;
          pts.push(project(Math.cos(phi) * Math.sin(a), Math.sin(phi), Math.cos(phi) * Math.cos(a)));
        }
        strokeLine(pts, lw);
      });
    }

    /* ---------- ORBIT ARROWS (arrows circling the globe) ---------- */
    const ORBIT_R = 1.3;
    const ORBIT_Z = -38 * Math.PI / 180;   // orbit tilt

    function orbitPoint(t) {
      const x = Math.cos(t) * ORBIT_R, z = Math.sin(t) * ORBIT_R;
      const xr = x * Math.cos(ORBIT_Z), yr = x * Math.sin(ORBIT_Z);
      return project(xr, yr, z);
    }

    function drawArrow(phase) {
      const span = 1.7, steps = 46;
      let prev = null;
      for (let i = 0; i <= steps; i++) {
        const t = phase - span + (i / steps) * span;
        const p = orbitPoint(t);
        if (prev) {
          const alpha = p.z > 0 ? 1 : 0.18;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(p.x, p.y);
          ctx.lineCap = "round";
          ctx.lineWidth = 1 + (i / steps) * R * 0.055;   // thin -> thick
          ctx.strokeStyle = `rgba(${LINE_COLOR},${alpha})`;
          ctx.stroke();
        }
        prev = p;
      }
      // arrow head
      const tip = orbitPoint(phase + 0.22);
      const dx = tip.x - prev.x, dy = tip.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const w = R * 0.11;
      const alpha = prev.z > 0 ? 1 : 0.18;
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(prev.x - uy * w, prev.y + ux * w);
      ctx.lineTo(prev.x + uy * w, prev.y - ux * w);
      ctx.closePath();
      ctx.fillStyle = `rgba(${LINE_COLOR},${alpha})`;
      ctx.fill();
    }

    /* ---------- ANIMATION LOOP ---------- */
    let last = performance.now(), rot = 0, orbit = 0;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reduce) { rot += dt * SPEED; orbit += dt * SPEED * 1.5; }

      ctx.clearRect(0, 0, W, W);
      drawArrow(orbit);              // arrow 1
      drawArrow(orbit + Math.PI);    // arrow 2 (opposite side)
      drawGlobe(rot);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---------- INTRO -> HOME PAGE ---------- */
    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    let done = false;

    function enterSite() {
      if (done) return;
      done = true;
      intro.classList.add("hide");
      site.classList.add("show");
      document.body.classList.remove("lock");
    }
    intro.addEventListener("click", enterSite);        // tap to skip
    setTimeout(enterSite, INTRO_TIME);                 // otherwise continues automatically
  </script>
</body>
</html>
