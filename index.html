<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZAX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, Arial, sans-serif; }

    /* ---------- LOGO INTRO ---------- */
    #intro {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .9s ease, visibility .9s ease;
    }
    #intro.hide { opacity: 0; visibility: hidden; }

    .logo-wrap {
      position: relative;
      width: min(52vw, 280px);
      aspect-ratio: 1;
    }
    .logo-wrap img {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: block;
      opacity: 0;
      animation: logoIn 1.6s cubic-bezier(.2,.8,.2,1) .2s forwards,
                 glow 2.4s ease-in-out 1.8s infinite;
    }
    /* thin ring that expands behind the logo */
    .logo-wrap::before, .logo-wrap::after {
      content: ""; position: absolute; inset: 0;
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 50%;
      opacity: 0;
      animation: ring 2s ease-out .6s forwards;
    }
    .logo-wrap::after { animation-delay: 1s; }

    @keyframes logoIn {
      0%   { opacity: 0; transform: scale(.4) rotate(-180deg); filter: blur(12px); }
      70%  { opacity: 1; transform: scale(1.06) rotate(8deg);  filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes ring {
      0%   { opacity: .8; transform: scale(1); }
      100% { opacity: 0;  transform: scale(2.4); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,.12); }
      50%      { box-shadow: 0 0 55px rgba(255,255,255,.35); }
    }

    /* ---------- YOUR WEBSITE ---------- */
    #site { opacity: 0; transition: opacity 1s ease .3s; padding: 40px 20px; text-align: center; }
    #site.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap img, .logo-wrap::before, .logo-wrap::after { animation: none; opacity: 1; }
      .logo-wrap::before, .logo-wrap::after { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Logo animation -->
  <div id="intro">
    <div class="logo-wrap">
      <img src="logo.png" alt="IZAX logo">
    </div>
  </div>

  <!-- Unga website content inga podunga -->
  <main id="site">
    <h1>Welcome to IZAX</h1>
    <p>Your website content goes here.</p>
  </main>

  <script>
    // Intro 3.2 seconds-ku apram maraiyum
    const INTRO_TIME = 3200;

    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("intro").classList.add("hide");
        document.getElementById("site").classList.add("show");
        document.body.style.overflow = "auto";
      }, INTRO_TIME);
    });

    document.body.style.overflow = "hidden";
  </script>
</body>
</html>
